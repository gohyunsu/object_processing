[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "object_processing"
version = "0.1.0"
description = "Mesh and object data-preparation pipeline for the AutoDex project"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "coacd",
    "networkx",
    "trimesh",
    "transforms3d",
    "scipy",
    "lxml",
    "mujoco",
    "imageio",
    "tqdm",
    "pymeshlab",
    "rtree",
]

# Visualization viewers depend on the external `paradex` package
# (paradex.visualization.visualizer.viser.ViserViewer). Installed separately
# from the paradex repo rather than vendored here.
[project.optional-dependencies]
viewers = ["viser", "shapely"]
# Headless Open3D rendering for object_processing.visualization.render (run via
# src/render.py: pipeline-stage figures, turntable GIFs). Optional and heavy;
# the rest of the package never imports it.
render = ["open3d"]

[tool.setuptools.packages.find]
include = ["object_processing*"]
