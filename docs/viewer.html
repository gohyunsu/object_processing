<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 14px;
    }

    header a:hover { text-decoration: underline; }

    header h2 {
      font-size: 18px;
      font-weight: 500;
    }

    .meta {
      font-size: 13px;
      color: #8b949e;
      margin-left: auto;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .meta .category {
      background: #21262d;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }

    .meta a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 13px;
    }

    #viewer-container {
      flex: 1;
      position: relative;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      outline: none;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #8b949e;
    }

    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #f85149;
    }

    #controls {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(22, 27, 34, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 160px;
      user-select: none;
    }

    .ctl-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .ctl-radio, .ctl-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      padding: 3px 0;
      cursor: pointer;
    }

    .ctl-check.disabled {
      color: #545d68;
      cursor: default;
    }

    .ctl-radio input, .ctl-check input { cursor: pointer; accent-color: #58a6ff; }
    .ctl-check.disabled input { cursor: default; }

    .ctl-btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
    .ctl-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      font: inherit;
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .ctl-btn:hover { border-color: #58a6ff; background: #262c36; }
    .ctl-btn:active { background: #1c2129; }

    .dims {
      font-size: 13px;
      color: #8b949e;
      font-variant-numeric: tabular-nums;
    }
    .dims b { color: #e6edf3; font-weight: 500; }

    #compare-bar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 16px;
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #8b949e;
      user-select: none;
    }
    #compare-bar input[type="range"] { width: 220px; accent-color: #58a6ff; cursor: ew-resize; }
    #compare-bar .lab { min-width: 64px; }
    #compare-bar .lab.right { text-align: right; }
  </style>
</head>
<body>
  <header>
    <a href="gallery.html">&larr; Gallery</a>
    <a href="index.html">Overview</a>
    <a href="https://github.com/willi19/object_processing" target="_blank" rel="noopener">Code</a>
    <a href="https://huggingface.co/datasets/willi19/object_processing" target="_blank" rel="noopener">Hugging Face</a>
    <h2 id="obj-label" style="margin-left:8px;">Loading...</h2>
    <div class="meta">
      <span class="dims" id="obj-dims" style="display:none;"></span>
      <span class="category" id="obj-category" style="display:none;"></span>
      <a id="buy-link" href="#" target="_blank" rel="noopener" style="display:none;">Buy on IKEA &#8599;</a>
      <a id="download-link" href="#" style="display:none;">Download GLB</a>
    </div>
  </header>
  <div id="viewer-container">
    <canvas id="renderCanvas"></canvas>
    <div id="controls"></div>
    <div id="compare-bar">
      <span class="lab">Raw</span>
      <input type="range" id="compare-range" min="0" max="1" step="0.001" value="0.5">
      <span class="lab right">Simplified</span>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading 3D model...</div>
    </div>
    <div id="error">
      <div style="font-size:48px;margin-bottom:12px;">&#9888;</div>
      <div id="error-msg">Failed to load model.</div>
    </div>
  </div>

  <!-- Pinned Babylon.js UMD builds — same version for core + loaders -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.34.3/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.34.3/babylonjs.loaders.min.js"></script>
  <script src="js/viewer.js?v=20260704-willi19-9aaa4ce-thumbnail-poses-v26"></script>
</body>
</html>
